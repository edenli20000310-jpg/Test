<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>農場田間資材管理系統</title>
  
  <!-- FullCalendar 6.x CDN -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { margin: 0; padding: 15px; background-color: #f4f6f8; color: #333; }
    h1, h2, h3 { color: #1b5e20; margin-top: 0; }
    .container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    .card-panel { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    
    /* 工具按鈕群 */
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
    button { cursor: pointer; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; transition: opacity 0.2s; color: #fff; background-color: #2e7d32; }
    button:hover { opacity: 0.9; }
    button.btn-secondary { background-color: #00796b; }
    button.btn-amber { background-color: #f57c00; }
    
    /* 試算機樣式 */
    .calc-tool-card { background-color: #f1f8e9; border: 1px solid #c8e6c9; border-radius: 8px; padding: 12px; margin-bottom: 15px; }
    .calc-flex { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .calc-input-group { flex: 1; min-width: 120px; }
    .calc-input-group label { font-size: 12px; color: #555; display: block; margin-bottom: 3px; }
    .calc-input-group input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    
    /* 防制紀錄卡片 */
    .prevention-card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-bottom: 15px; background-color: #fafafa; }
    .drug-matrix-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
    .drug-matrix-row select, .drug-matrix-row input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    .input-with-btn { display: flex; align-items: center; flex: 1; min-width: 130px; }
    .input-with-btn input { width: 100%; border-top-right-radius: 0; border-bottom-right-radius: 0; }
    .input-with-btn button { border-top-left-radius: 0; border-bottom-left-radius: 0; padding: 8px 10px; background-color: #81c784; }
    
    /* 表格樣式 */
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; background-color: #fff; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: center; font-size: 14px; }
    th { background-color: #e8f5e9; color: #1b5e20; }
    
    /* FullCalendar 日曆區域 */
    #calendar { max-width: 100%; height: 500px; margin-top: 10px; }
  </style>
</head>
<body>

<div class="container">

  <!-- 頂部標題與核心按鈕列 -->
  <div class="card-panel">
    <h1>🌱 農場田間資材管理系統</h1>
    <div class="btn-group">
      <button onclick="exportTableToCSV('田間工作總表.csv')">📥 匯出大總表 CSV</button>
      <button class="btn-secondary" onclick="copyTargetToActualAll()">⚡ 全區預計量帶入實際量</button>
      <button class="btn-amber" onclick="generatePhiEvents()">🛡️ 試算並標記安全採收期 (PHI)</button>
    </div>
  </div>

  <!-- 稀釋用量快速試算機 -->
  <div class="card-panel">
    <div class="calc-tool-card">
      <div style="font-weight: bold; color: #2e7d32; margin-bottom: 8px;">🧮 藥品稀釋用量快速試算機</div>
      <div class="calc-flex">
        <div class="calc-input-group">
          <label>總噴藥水量 (L)</label>
          <input type="number" id="calcWaterLiters" placeholder="例如: 200" oninput="calculateDose()">
        </div>
        <div class="calc-input-group">
          <label>稀釋倍數 (倍)</label>
          <input type="number" id="calcDilutionRatio" placeholder="例如: 1000" oninput="calculateDose()">
        </div>
        <div class="calc-input-group" style="background-color: #fff; padding: 8px; border-radius: 4px; border: 1px dashed #81c784; text-align: center;">
          <span style="font-size: 11px; color: #666; display: block;">計算所需藥量</span>
          <strong id="calcResultDisplay" style="font-size: 16px; color: #1b5e20;">0 mL / g</strong>
        </div>
      </div>
      <div style="font-size: 11px; color: #777; margin-top: 6px;">
        💡 點擊資材列旁邊的「⚡」按鈕，即可將算出的藥量帶入該欄位。
      </div>
    </div>
  </div>

  <!-- 防制紀錄輸入區 (卡片式) -->
  <div class="card-panel">
    <h2>📝 第 1 波防制紀錄卡片</h2>
    
    <div style="margin-bottom: 12px; display: flex; gap: 15px; flex-wrap: wrap;">
      <div>
        <label>施用日期：</label>
        <input type="date" id="sprayDate_1" value="2026-08-12">
      </div>
      <div>
        <label>田區代號：</label>
        <input type="text" id="fieldCode_1" value="A區-芒果" placeholder="田區名稱">
      </div>
    </div>

    <div class="prevention-card">
      <div id="drugRowsContainer_1">
        <!-- 第 1 列藥品品項 -->
        <div class="drug-matrix-row">
          <select class="chemical-select" style="flex: 2; min-width: 150px;">
            <option value="">選擇藥品/資材...</option>
            <option value="亞托敏" data-phi="9">亞托敏 (安全採收期: 9天)</option>
            <option value="益達胺" data-phi="14">益達胺 (安全採收期: 14天)</option>
            <option value="待克利" data-phi="7">待克利 (安全採收期: 7天)</option>
            <option value="蘇力菌" data-phi="0">蘇力菌 (無採收期限制)</option>
          </select>

          <div class="input-with-btn">
            <input type="number" class="target-input" placeholder="預計量 (mL/g)">
            <button type="button" onclick="applyCalculatedDose(this.previousElementSibling)" title="帶入試算結果">⚡</button>
          </div>

          <div class="input-with-btn">
            <input type="number" class="actual-input" placeholder="實際量 (mL/g)">
            <button type="button" onclick="applyCalculatedDose(this.previousElementSibling)" title="帶入試算結果">⚡</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 田間工作統整大總表 -->
  <div class="card-panel">
    <h2>📊 田間工作統整大總表</h2>
    <div class="table-container">
      <table id="matrixTableDom">
        <thead>
          <tr>
            <th>防制波次</th>
            <th>施用日期</th>
            <th>田區</th>
            <th>資材名稱</th>
            <th>預計用量</th>
            <th>實際用量</th>
            <th>安全採收可摘採日 (PHI)</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>第 1 波</td>
            <td>2026-08-12</td>
            <td>A區-芒果</td>
            <td>亞托敏</td>
            <td>200 mL</td>
            <td>200 mL</td>
            <td style="color: #2e7d32; font-weight: bold;">2026-08-21</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 行事曆預覽區 -->
  <div class="card-panel">
    <h2>📅 農務與採收期行事曆</h2>
    <div id="calendar"></div>
  </div>

</div>

<script>
  let calendar = null;
  let lastCalculatedDose = 0;

  // 初始化 FullCalendar
  document.addEventListener('DOMContentLoaded', function() {
    const calendarEl = document.getElementById('calendar');
    calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'dayGridMonth',
      locale: 'zh-tw',
      headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        right: 'dayGridMonth,timeGridWeek'
      },
      events: [
        {
          title: '🌱 [第1波] 噴灑亞托敏',
          start: '2026-08-12',
          backgroundColor: '#2e7d32'
        },
        {
          title: '🍎 [可採收] A區-芒果 (亞托敏解禁)',
          start: '2026-08-21',
          backgroundColor: '#388e3c'
        }
      ]
    });
    calendar.render();
  });

  // 1. 稀釋用量試算邏輯
  function calculateDose() {
    const waterLiters = parseFloat(document.getElementById("calcWaterLiters").value) || 0;
    const ratio = parseFloat(document.getElementById("calcDilutionRatio").value) || 0;
    const resultDisplay = document.getElementById("calcResultDisplay");

    if (waterLiters <= 0 || ratio <= 0) {
      resultDisplay.innerText = "0 mL / g";
      lastCalculatedDose = 0;
      return;
    }

    const dose = Math.round(((waterLiters * 1000) / ratio) * 10) / 10;
    lastCalculatedDose = dose;
    resultDisplay.innerText = `${dose} mL / g`;
  }

  // 2. 將試算出的藥量帶入指定的 input 欄位
  function applyCalculatedDose(targetInput) {
    if (lastCalculatedDose <= 0) {
      alert("請先在試算機中輸入有效的水量與稀釋倍數！");
      return;
    }
    if (targetInput) {
      targetInput.value = lastCalculatedDose;
    }
  }

  // 3. 一鍵將全區「預計用量」帶入「實際用量」
  function copyTargetToActualAll() {
    const targetInputs = document.querySelectorAll(".target-input");
    let copiedCount = 0;
    targetInputs.forEach(target => {
      const parentRow = target.closest(".drug-matrix-row");
      if (parentRow) {
        const actualInput = parentRow.querySelector(".actual-input");
        if (actualInput && target.value && !actualInput.value) {
          actualInput.value = target.value;
          copiedCount++;
        }
      }
    });
    alert(`完成！已為 ${copiedCount} 筆欄位自動帶入預計用量。`);
  }

  // 4. 匯出總表為 CSV
  function exportTableToCSV(filename) {
    const table = document.getElementById("matrixTableDom");
    let csv = [];
    for (let row of table.rows) {
      let cols = Array.from(row.cells).map(cell => `"${cell.innerText.replace(/"/g, '""')}"`);
      csv.push(cols.join(","));
    }
    const csvFile = new Blob(["\ufeff" + csv.join("\n")], { type: "text/csv;charset=utf-8;" });
    const downloadLink = document.createElement("a");
    downloadLink.download = filename;
    downloadLink.href = window.URL.createObjectURL(csvFile);
    downloadLink.style.display = "none";
    document.body.appendChild(downloadLink);
    downloadLink.click();
  }

  // 5. 安全採收期 (PHI) 動態試算並加到 FullCalendar
  function generatePhiEvents() {
    const sprayDateVal = document.getElementById("sprayDate_1").value;
    const fieldCode = document.getElementById("fieldCode_1").value || "未指定田區";
    const selectEl = document.querySelector(".chemical-select");
    const selectedOption = selectEl.options[selectEl.selectedIndex];

    if (!sprayDateVal || !selectedOption.value) {
      alert("請確認已選擇施用日期與藥品資材！");
      return;
    }

    const phiDays = parseInt(selectedOption.getAttribute("data-phi")) || 0;
    const sprayDate = new Date(sprayDateVal);
    
    // 計算可採收日期 = 施藥日期 + 安全採收天數
    const safeHarvestDate = new Date(sprayDate);
    safeHarvestDate.setDate(sprayDate.getDate() + phiDays);
    const harvestDateStr = safeHarvestDate.toISOString().split('T')[0];

    // 新增至 FullCalendar
    if (calendar) {
      calendar.addEvent({
        title: `🍎 [解禁採收] ${fieldCode} (${selectedOption.value})`,
        start: harvestDateStr,
        backgroundColor: '#f57c00'
      });
      alert(`已成功為 ${selectedOption.value} 算出安全採收日：${harvestDateStr}，並標記於行事曆！`);
    }
  }
</script>

</body>
</html>
