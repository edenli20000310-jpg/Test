<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>農場一體化管理系統 - 極速升級版</title>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
  <style>
    :root {
      --primary-color: #2e7d32;
      --secondary-color: #388e3c;
      --orange-color: #d84315;
      --line-color: #06C755;
      --bg-color: #f4f6f4;
      --border-color: #c5e1a5;
    }
    body {
      font-family: "-apple-system", "BlinkMacSystemFont", "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
      background-color: var(--bg-color); margin: 0; padding: 10px; color: #333;
      -webkit-text-size-adjust: 100%;
    }
    .container {
      max-width: 1650px; margin: 0 auto; background: #ffffff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    h1 { font-size: 18px; color: var(--primary-color); border-left: 6px solid var(--primary-color); padding-left: 10px; margin: 5px 0 15px 0; }
    h2 { font-size: 15px; color: #1b5e20; margin-top: 0; display: flex; align-items: center; gap: 8px; }
    h3 { font-size: 14px; margin: 0 0 10px 0; }
    
    .step-section { background: #fafafa; border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; margin-bottom: 0; }
    .flex-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    
    select, input, button { padding: 10px 12px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; outline: none; box-sizing: border-box; }
    button { background-color: var(--primary-color); color: white; border: none; cursor: pointer; font-weight: bold; }
    button:disabled { background-color: #cccccc !important; cursor: not-allowed; }

    /* 頂部區域佈局 */
    .upper-block { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }

    /* 控制區塊格線 */
    .control-box { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
      gap: 15px; 
    }

    .calendar-container { background: #ffffff; padding: 12px; border-radius: 8px; border: 1px solid #ddd; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .filter-panel-box { background: #f1f8e9; padding: 12px; border-radius: 8px; border: 1px solid #c5e1a5; display: flex; flex-direction: column; gap: 10px; }
    .filter-section-title { font-weight: bold; color: #1b5e20; font-size: 13px; }
    
    .batch-btn { background: #ffffff; color: #2e7d32; border: 2px solid #2e7d32; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; user-select: none; }
    .batch-btn.active { background: #2e7d32; color: #ffffff; }
    
    .sub-drawer-container { background: #ffffff; border: 1px dashed #a5d6a7; padding: 10px; border-radius: 6px; }
    .sub-batch-wrapper { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .sub-item-label { background: #e3f2fd; color: #0d47a1; border: 1px solid #90caf9; padding: 6px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; display: inline-flex; align-items: center; gap: 4px; }
    .sub-item-label.disabled { background: #eceff1; color: #90a4ae; border-color: #cfd8dc; text-decoration: line-through; }
    
    #calendar { width: 100%; min-height: 400px; font-size: 13px; }

    .fc .fc-list-day.fc-day-today .fc-list-day-cushion {
      background-color: #e8f5e9 !important; border-left: 5px solid #2e7d32 !important;
    }
    .fc .fc-list-day.fc-day-today .fc-list-day-text,
    .fc .fc-list-day.fc-day-today .fc-list-day-side-text {
      font-weight: 900 !important; color: #1b5e20 !important; font-size: 14px;
    }
    .fc .fc-list-day.fc-day-today .fc-list-day-text::before {
      content: "📍【今天】 "; color: #d84315; font-weight: bold;
    }
    .fc .fc-daygrid-day.fc-day-today { background-color: #f1f8e9 !important; }

    /* 田間工作統整大總表樣式 */
    .summary-table-block { background: #ffffff; border: 1px solid #b0bec5; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
    .table-responsive-wrapper { width: 100%; overflow-x: auto; margin-top: 10px; }
    .matrix-table { width: 100%; border-collapse: collapse; text-align: center; font-size: 13px; }
    .matrix-table th, .matrix-table td { border: 1px solid #cfd8dc; padding: 8px 6px; white-space: nowrap; }
    .matrix-header-title { background-color: #eceff1; color: #37474f; position: sticky; left: 0; z-index: 2; }
    .matrix-header-batch { background-color: #2e7d32; color: white; }
    .matrix-axis-y { background-color: #f5f5f5; font-weight: bold; position: sticky; left: 0; z-index: 1; }
    .matrix-drug-row { background-color: #fffde7; }
    .matrix-date-text { font-family: monospace; font-size: 12px; font-weight: bold; }
    .matrix-date-empty { color: #bbb; font-style: italic; font-weight: normal; }

    .upcoming-highlight { 
      background-color: #fff176 !important; color: #000000 !important; border: 2px solid #f57f17 !important; font-size: 13px !important;
    }

    .lower-block { background: #ffffff; border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; }
    .panel-header { display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #e0e0e0; padding-bottom: 12px; margin-bottom: 15px; }
    @media (min-width: 768px) { .panel-header { flex-direction: row; justify-content: space-between; align-items: center; } }
    
    .logs-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
    @media (min-width: 600px) { .logs-grid { grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); } }
    
    .wave-card { border: 1px solid #cfd8dc; border-radius: 8px; background: #fff; padding: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
    .wave-card h4 { margin: 0 0 8px 0; color: #1b5e20; background: #e8f5e9; padding: 8px; text-align: center; font-size: 15px; border-radius: 4px; }
    
    .meta-bar { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #444; margin-bottom: 12px; background: #f1f8e9; padding: 6px 10px; border-radius: 6px; }
    .water-edit-box { display: inline-flex; align-items: center; gap: 4px; font-weight: bold; color: #1b5e20; }
    .water-input { width: 75px !important; padding: 4px 6px !important; text-align: center; font-weight: bold; color: #2e7d32; border: 1px solid #81c784 !important; background: #fff; }

    .disease-container { display: flex; flex-direction: column; border-bottom: 1px dashed #e0e0e0; padding-bottom: 8px; margin-bottom: 8px; }
    .disease-title-row { font-size: 12px; font-weight: bold; color: #37474f; margin-bottom: 6px; background: #f5f5f5; padding: 4px 6px; border-radius: 3px; }
    
    .drug-matrix-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; width: 100%; }
    .drug-index-label { font-size: 12px; color: #777; width: 35px; flex-shrink: 0; font-weight: bold; }
    .chemical-select { flex: 1; font-size: 13px; padding: 6px; min-width: 0; } 
    .num-input { width: 50px; font-size: 13px; padding: 6px; text-align: center; flex-shrink: 0; }
    
    .loading-hint { color: #d84315; font-weight: bold; display: none; }
    
    #globalBlocker {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(255, 255, 255, 0.7); z-index: 9999;
      display: none; align-items: center; justify-content: center;
      font-size: 18px; font-weight: bold; color: #2e7d32;
    }

    /* 🔐 模式選擇門控 Modal 樣式 */
    #modeModal {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.6); z-index: 10000;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-card {
      background: #ffffff; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center;
    }
    .modal-card h2 { justify-content: center; font-size: 18px; color: var(--primary-color); margin-bottom: 15px; }
    .mode-btn-group { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
    .btn-view-mode { background-color: #0288d1; }
    .btn-edit-mode { background-color: #2e7d32; }
    .pwd-input-box { display: none; flex-direction: column; gap: 10px; margin-top: 15px; }
    .mode-badge {
      display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold;
      color: white; margin-left: 10px;
    }
    .badge-view { background-color: #0288d1; }
    .badge-edit { background-color: #2e7d32; }
  </style>
</head>
<body>

<!-- 🔐 初始化模式選擇門控窗口 -->
<div id="modeModal">
  <div class="modal-card">
    <h2>🌾 請選擇進入模式</h2>
    <p style="font-size: 13px; color: #666; margin-bottom: 15px;">【瀏覽模式】僅供查看資料，【編輯模式】可修改與寫回資料。</p>
    
    <div class="mode-btn-group" id="modalChoiceBtns">
      <button class="btn-view-mode" onclick="setSystemMode('view')">👀 瀏覽模式 (唯讀)</button>
      <button class="btn-edit-mode" onclick="showPasswordInput()">✏️ 編輯模式 (需密碼)</button>
    </div>

    <div class="pwd-input-box" id="pwdInputBox">
      <input type="password" id="editPasswordInput" placeholder="請輸入編輯密碼..." onkeydown="if(event.key==='Enter') verifyPasswordAndEnter()">
      <div style="display: flex; gap: 8px;">
        <button onclick="verifyPasswordAndEnter()" style="flex: 1; background-color: #2e7d32;">確認解鎖</button>
        <button onclick="hidePasswordInput()" style="background-color: #757575;">返回</button>
      </div>
      <span id="pwdErrorMsg" style="color: #d84315; font-size: 12px; display: none;">❌ 密碼錯誤，請重新輸入！</span>
    </div>
  </div>
</div>

<div id="globalBlocker">⏳ 系統正在讀取與同步資料，請稍候...</div>

<div class="container">
  <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
    <h1>
      🌾 農場一體化管理系統（極速流暢版）
      <span id="currentModeBadge" class="mode-badge badge-view">👀 瀏覽模式</span>
    </h1>
    <button id="switchModeBtn" onclick="openModeModal()" style="background-color: #546e7a; font-size: 12px; padding: 6px 12px;">🔄 切換模式</button>
  </div>
  
  <div class="step-section" style="margin-bottom: 15px;">
    <div class="flex-group">
      <button id="loadFilesBtn" onclick="fetchFileList()">🔍 讀取雲端硬碟試算表清單</button>
      <select id="fileSelect" onchange="onFileSelected()" style="display:none;"></select>
      <span id="globalLoading" class="loading-hint">⏳ 極速同步中...</span>
    </div>
  </div>

  <div id="mainWorkspaceUI" style="display:none;">
    
    <!-- 頂部控制區塊 -->
    <div class="upper-block">
      <div class="control-box">
        <div class="step-section">
          <h3>➕ 快速建立新批次分頁</h3>
          <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <input type="number" id="newBatchNum" placeholder="批次數字 (如 3)" style="flex: 1; min-width: 120px;">
            <input type="text" id="newBatchSuffix" placeholder="自訂後綴 (如 A)" style="flex: 1; min-width: 120px;">
            <button class="edit-required-btn" id="createSheetBtn" onclick="createNewBatchSheet()" style="min-width: 160px;">新增分頁並排定順序</button>
          </div>
        </div>
        
        <div class="step-section">
          <h3>🧼 資料庫優化與清洗</h3>
          <div style="display: flex; align-items: center; height: calc(100% - 25px);">
            <button class="edit-required-btn" id="cleanChemBtn" onclick="runChemicalCleaning()" style="background-color: #37474f; width: 100%;">執行「藥品分頁」雙向清洗排序</button>
          </div>
        </div>
      </div>

      <div class="calendar-container">
        <div class="filter-panel-box">
          <div class="filter-section-title">📅 Step 1. 點擊複選主批次：</div>
          <div id="mainBatchButtonsArea" class="flex-group" style="flex-direction:row;"></div>
          
          <div id="subDrawerArea" class="sub-drawer-container" style="display:none;">
            <div class="filter-section-title">🧪 Step 2. 點選/點掉特定後綴分頁：</div>
            <div id="subBatchChecksArea" class="sub-batch-wrapper"></div>
          </div>
        </div>
        <div id="calendar"></div>
      </div>
    </div>

    <!-- 田間工作統整大總表 -->
    <div class="summary-table-block">
      <div style="margin-bottom: 12px;">
        <h2 style="margin:0 0 5px 0;"><span style="font-size:20px;">📊</span> 田間工作統整大總表</h2>
        <p style="font-size:12px; color:#555; margin:0 0 10px 0;">👉 系統會於切換檔案時自動彙整並更新雲端「統整」分頁。黃色 ⏰ 儲存格為**未來 7 天內**。</p>
        
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
          <button class="edit-required-btn" id="saveSummaryToBackendBtn" onclick="saveSummaryMatrixToExcel()" style="background-color: #0d47a1; font-size: 14px; flex: 1; padding: 12px; min-width:200px;">💾 手動強制將總表矩陣寫回「統整」分頁</button>
          <button class="edit-required-btn" id="sendLineBtn" onclick="sendWeeklySummaryToLine()" style="background-color: var(--line-color); color: white; font-size: 14px; flex: 1; padding: 12px; min-width:200px;">📲 發送未來一週事項至 LINE</button>
        </div>
      </div>
      
      <div class="table-responsive-wrapper">
        <table class="matrix-table" id="matrixTableDom"></table>
      </div>
    </div>
    
    <div class="lower-block">
      <div class="panel-header">
        <div class="flex-group" style="flex-direction:row; width:100%;">
          <h2 style="margin:0; white-space:nowrap; color:var(--primary-color);">📋 10 波防制紀錄</h2>
          <select id="sheetListSelect" onchange="renderCachedMedicationLogs()" style="font-weight:bold; border-color:var(--primary-color); flex:1;"></select>
        </div>
        <button class="edit-required-btn" id="saveLogsBtn" onclick="saveMedicationLogsToBackend()" style="background-color:var(--orange-color); font-size:15px; width:100%;">💾 儲存修改（水量與藥劑）寫回 Excel</button>
      </div>
      <div id="logsLoadingStatus" style="font-style:italic; color:#666; margin-bottom:10px; font-size:13px;"></div>
      <div class="logs-grid" id="logsGridContainer"></div>
    </div>
    
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxSK8a1fWWdA3XjUgW5x5HPdiZAQ_Mw16HRWEmu-RWme4vinXd7IBKBSStzPuRSi_I/exec"; 

  let currentFileId = "";
  let globalChemicalOptions = []; 
  let cachedLogsData = []; 
  let calendar = null;
  let allRawEvents = []; 
  let computedSummaryMatrixPayload = {};

  let activeMainBatches = new Set();
  let subItemRegistry = {}; 

  // 🔐 模式與安全控制變數
  let isEditMode = false;
  const EDIT_PASSWORD = "eden"; 

  const mainBatchBgColors = [
    "#e8f5e9", "#e3f2fd", "#fff3e0", "#f3e5f5", "#ffebee", 
    "#e0f7fa", "#f9fbe7", "#fff8e1", "#f0f4c3", "#e0f2f1"
  ];

  const FIXED_ROW_ITEMS = [
    "播種", "定植", "藥-1", "摘心", "藥-2", "整蔓", "藥-3", "摘母蔓心", 
    "藥-4", "摘果蔓芯", "著果", "藥-5", "催果", "疏花疏果", "襯果墊", 
    "藥-6", "藥-7", "藥-8", "藥-9", "採收", "實際採收"
  ];

  // 🔐 門控 Modal 控制邏輯
  function openModeModal() {
    document.getElementById("modeModal").style.display = "flex";
    document.getElementById("modalChoiceBtns").style.display = "flex";
    document.getElementById("pwdInputBox").style.display = "none";
    document.getElementById("pwdErrorMsg").style.display = "none";
    document.getElementById("editPasswordInput").value = "";
  }

  function showPasswordInput() {
    document.getElementById("modalChoiceBtns").style.display = "none";
    document.getElementById("pwdInputBox").style.display = "flex";
    document.getElementById("editPasswordInput").focus();
  }

  function hidePasswordInput() {
    document.getElementById("modalChoiceBtns").style.display = "flex";
    document.getElementById("pwdInputBox").style.display = "none";
    document.getElementById("pwdErrorMsg").style.display = "none";
  }

  function verifyPasswordAndEnter() {
    const inputPwd = document.getElementById("editPasswordInput").value.trim();
    if (inputPwd === EDIT_PASSWORD) {
      setSystemMode('edit');
      document.getElementById("modeModal").style.display = "none";
    } else {
      document.getElementById("pwdErrorMsg").style.display = "block";
    }
  }

  function setSystemMode(mode) {
    isEditMode = (mode === 'edit');
    document.getElementById("modeModal").style.display = "none";
    
    // 更新 Badge 顯示
    const badge = document.getElementById("currentModeBadge");
    if (isEditMode) {
      badge.innerText = "✏️ 編輯模式";
      badge.className = "mode-badge badge-edit";
    } else {
      badge.innerText = "👀 瀏覽模式";
      badge.className = "mode-badge badge-view";
    }

    // 禁用/啟用所有帶有 edit-required-btn 類別的按鈕
    document.querySelectorAll(".edit-required-btn").forEach(btn => {
      btn.disabled = !isEditMode;
    });

    // 重新渲染日曆與大總表（切換是否可拖拽或雙擊編輯）
    if (calendar) {
      calendar.setOption('editable', isEditMode);
      calendar.setOption('droppable', isEditMode);
    }
    renderFixedSummaryMatrix();
    renderCachedMedicationLogs();
  }

  function setGlobalBlocker(show, text = "⏳ 系統正在讀取與同步資料，請稍候...") {
    const blocker = document.getElementById("globalBlocker");
    if (blocker) {
      blocker.innerText = text;
      blocker.style.display = show ? "flex" : "none";
    }
  }

  function isGasSuccess(responseText) {
    if (!responseText) return false;
    const str = responseText.trim();
    return str.includes("OK") || str.startsWith("<!DOCTYPE") || str.includes("success");
  }

  function getTextColorFromString(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) { hash = str.charCodeAt(i) + ((hash << 5) - hash); }
    const darkColors = ["#1b5e20", "#0d47a1", "#b71c1c", "#4a148c", "#e65100", "#006064"];
    return darkColors[Math.abs(hash) % darkColors.length];
  }

  function getMainBatchName(sheetName) {
    if (sheetName === "統整" || sheetName === "大總表") return "大總表";
    let match = sheetName.match(/第\d+批/);
    return match ? match[0] : sheetName;
  }

  function getBgColorByMainBatch(sheetName) {
    let mainBatch = getMainBatchName(sheetName);
    let hash = 0;
    for (let i = 0; i < mainBatch.length; i++) { hash = mainBatch.charCodeAt(i) + ((hash << 5) - hash); }
    return mainBatchBgColors[Math.abs(hash) % mainBatchBgColors.length];
  }

  function fetchFileList() {
    setGlobalBlocker(true, "🔍 正在讀取雲端硬碟檔案清單...");
    fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        if (data.error) { alert(data.error); return; }
        const select = document.getElementById("fileSelect");
        select.innerHTML = '<option value="">-- 請選取試算表檔案 --</option>';
        data.files.forEach(f => {
          let opt = document.createElement("option"); opt.value = f.id; opt.innerText = f.name; select.appendChild(opt);
        });
        select.style.display = "inline-block"; document.getElementById("loadFilesBtn").style.display = "none";
      })
      .catch(() => alert("載入清單失敗。"))
      .finally(() => setGlobalBlocker(false));
  }

  function onFileSelected() {
    currentFileId = document.getElementById("fileSelect").value;
    if (!currentFileId) { document.getElementById("mainWorkspaceUI").style.display = "none"; return; }
    
    setGlobalBlocker(true, "🚀 正在全面初始化試算表與日曆資料...");
    document.getElementById("mainWorkspaceUI").style.display = "block";
    activeMainBatches.clear();
    subItemRegistry = {};
    
    initFullCalendar();
    fetchMedicationLogsFromBackend(true);
  }

  function loadAllEvents() {
    if (calendar) {
      calendar.refetchEvents();
    }
  }

  function initFullCalendar() {
    const calendarEl = document.getElementById('calendar');
    if (calendar) calendar.destroy();
    
    const isMobile = window.innerWidth < 768;
    
    calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: isMobile ? 'listWeek' : 'dayGridMonth', 
      locale: 'zh-tw',
      editable: isEditMode, // 依據模式開啟或禁用拖拽
      droppable: isEditMode,
      nowIndicator: true,
      headerToolbar: { 
        left: 'prev,next today', 
        center: 'title', 
        right: isMobile ? 'listWeek,dayGridMonth' : 'dayGridMonth,timeGridWeek' 
      },
      height: 'auto',          
      handleWindowResize: true,
      
      eventContent: function(arg) {
        let sheetName = arg.event.extendedProps.sheetName || "";
        let title = arg.event.title || "";
        
        let customEl = document.createElement('div');
        customEl.style.padding = '2px 4px';
        customEl.style.fontSize = '12px';
        customEl.style.lineHeight = '1.2';
        customEl.style.overflow = 'hidden';
        customEl.style.textOverflow = 'ellipsis';
        customEl.style.whiteSpace = 'nowrap';
        
        customEl.innerHTML = `<strong>[${sheetName}]</strong> ${title}`;

      },

      eventDrop: function(info) { 
        if (!isEditMode) { info.revert(); return; }

      },
      eventResize: function(info) { 
        if (!isEditMode) { info.revert(); return; }
        updateEventDateToBackend(info); 
      },

      events: function(fetchInfo, successCallback, failureCallback) {
        fetch(`${API_URL}?fileId=${currentFileId}&action=getEvents`)

  function updateEventDateToBackend(info) {
    const eventObj = info.event;

    let rawTaskName = eventObj.title.replace(/^\[.*?\]\s*/, '').trim();
    const newStartDate = eventObj.startStr.split("T")[0];

    fetch(API_URL, {

        type: "updateEventDate",
        fileId: currentFileId,
        sheetName: sheetName,
        taskName: rawTaskName,
        newDate: newStartDate
      })
    })
    .then(res => res.text())
    .then(result => {
      if (isGasSuccess(result)) {
        let rawItem = allRawEvents.find(e => e.extendedProps.sheetName === sheetName && e.title === rawTaskName);
        if (rawItem) rawItem.start = newStartDate;
        
        renderFixedSummaryMatrix();

  function buildSmartTagInterface(events) {
    const buttonsArea = document.getElementById("mainBatchButtonsArea");
    let mainBatches = new Set();
    
    events.forEach(e => {
      if(e.extendedProps && e.extendedProps.sheetName){
        let fullSheetName = e.extendedProps.sheetName;
        if(fullSheetName !== "統整" && fullSheetName !== "大總表") {
          mainBatches.add(getMainBatchName(fullSheetName));
          if (subItemRegistry[fullSheetName] === undefined) {
            subItemRegistry[fullSheetName] = true;
          }
        }
      }
    });
    
    buttonsArea.innerHTML = "";
    Array.from(mainBatches).sort().forEach(mb => {
      let btn = document.createElement("div");
      btn.className = `batch-btn ${activeMainBatches.has(mb) ? 'active' : ''}`;
      btn.innerText = mb;
      btn.onclick = () => selectMainBatchToggle(mb, btn);
      buttonsArea.appendChild(btn);
    });
    refreshSubDrawer();
  }

  function selectMainBatchToggle(mb, btnElement) {
    if (activeMainBatches.has(mb)) {
      activeMainBatches.delete(mb);
      btnElement.classList.remove("active");
    } else {
      activeMainBatches.add(mb);
      btnElement.classList.add("active");
    }
    refreshSubDrawer();
    triggerCalendarPipelineRefresh();
  }

  function refreshSubDrawer() {
    const drawer = document.getElementById("subDrawerArea");
    const checksArea = document.getElementById("subBatchChecksArea");
    if (activeMainBatches.size === 0) { drawer.style.display = "none"; return; }
    
    let subItems = Object.keys(subItemRegistry).filter(k => activeMainBatches.has(getMainBatchName(k)));
    if (subItems.length === 0) { drawer.style.display = "none"; return; }
    
    drawer.style.display = "block"; checksArea.innerHTML = "";
    
    subItems.sort().forEach(subName => {
      let isChecked = subItemRegistry[subName];
      let lbl = document.createElement("label");
      lbl.className = `sub-item-label ${isChecked ? '' : 'disabled'}`;
      let chk = document.createElement("input");
      chk.type = "checkbox"; chk.checked = isChecked;
      
      chk.onchange = (e) => {
        subItemRegistry[subName] = e.target.checked;
        if (e.target.checked) lbl.classList.remove("disabled");
        else lbl.classList.add("disabled");
        triggerCalendarPipelineRefresh();
      };
      
      lbl.appendChild(chk);
      lbl.appendChild(document.createTextNode(" " + subName));
      checksArea.appendChild(lbl);
    });
  }

  function executeRenderPipeline(successCallback) {
    let filtered = allRawEvents.filter(evt => {
      if(!evt.extendedProps || !evt.extendedProps.sheetName) return false;
      let fullSheetName = evt.extendedProps.sheetName;
      if(fullSheetName === "統整" || fullSheetName === "大總表") return false;
      let mBatch = getMainBatchName(fullSheetName);
      
      if (activeMainBatches.size > 0) {
        if (!activeMainBatches.has(mBatch)) return false;
        return subItemRegistry[fullSheetName] === true;
      }
      return subItemRegistry[fullSheetName] === true;
    });
    
    let colored = filtered.map(evt => {
      return {
        ...evt,
        backgroundColor: getBgColorByMainBatch(evt.extendedProps.sheetName),
        textColor: getTextColorFromString(evt.extendedProps.sheetName)
      };
    });
    
    if (successCallback) successCallback(colored);
    else {
      calendar.removeAllEvents(); calendar.addEventSource(colored); calendar.updateSize();
    }
  }

  function renderFixedSummaryMatrix() {
    const table = document.getElementById("matrixTableDom");
    table.innerHTML = "";

    let allSheets = [];
    allRawEvents.forEach(evt => {
      if(evt.extendedProps && evt.extendedProps.sheetName){
        let sName = evt.extendedProps.sheetName;
        if (sName && sName !== "統整" && sName !== "大總表" && !allSheets.includes(sName)) {
          allSheets.push(sName);
        }
      }
    });
    
    allSheets.sort((a, b) => a.localeCompare(b, 'zh-Hant', { numeric: true }));

    if (allSheets.length === 0) {
      table.innerHTML = `<tr><td style="padding:25px; color:#999; text-align:center;">⏳ 尚無可比對的分頁資料。</td></tr>`;
      return;
    }

    computedSummaryMatrixPayload = { headers: [...allSheets], rows: [] };

    let theadHtml = `<thead><tr><th class="matrix-header-title">作業項目</th>`;
    allSheets.forEach(sheetName => { theadHtml += `<th class="matrix-header-batch">${sheetName}</th>`; });
    theadHtml += `</tr></thead><tbody>`;
    table.innerHTML += theadHtml;

    const today = new Date();
    today.setHours(0,0,0,0);
    const future7Days = new Date(today.getTime() + 7 * 24 * 60 * 60 * 1000);
    future7Days.setHours(23,59,59,999);

    let tbodyHtml = "";
    FIXED_ROW_ITEMS.forEach(rowTitle => {
      let isDrugRow = rowTitle.startsWith("藥-");
      let trClass = isDrugRow ? 'class="matrix-drug-row"' : '';
      tbodyHtml += `<tr ${trClass}><td class="matrix-axis-y">${rowTitle}</td>`;
      
      let rowValuesCache = [];

      allSheets.forEach(sheetName => {
        let matchEvent = allRawEvents.find(evt => {
          if (!evt.extendedProps || evt.extendedProps.sheetName !== sheetName) return false;
          let eTitle = evt.title ? evt.title.trim() : "";
          let rTitle = rowTitle.trim();
          return eTitle === rTitle || eTitle.startsWith(rTitle + "(") || eTitle.includes(rTitle);
        });
        
        let dateShow = "(未排定)";
        let isUpcoming = false;
        let isToday = false;

        if (matchEvent && matchEvent.start) {
          dateShow = matchEvent.start.trim().replace(/\//g, "-");
          let dateObj = new Date(dateShow);
          
          if (!isNaN(dateObj.getTime())) {
            const todayUtc = Date.UTC(today.getFullYear(), today.getMonth(), today.getDate());
            const eventUtc = Date.UTC(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());

            if (eventUtc === todayUtc) {
              isToday = true;
            } else if (eventUtc > todayUtc && eventUtc <= future7Days.getTime()) {
              isUpcoming = true;
            }
          }
        }

        rowValuesCache.push(dateShow);

        let cellContent = dateShow;
        if (isToday) cellContent = `📍${dateShow}`;
        else if (isUpcoming) cellContent = `⏰${dateShow}`;
        else if (dateShow === "(未排定)") cellContent = `<span class="matrix-date-empty">${dateShow}</span>`;

        let cellClass = "matrix-date-text";
        if (isToday || isUpcoming) cellClass += " upcoming-highlight";

        // 🔐 僅在編輯模式下啟用雙擊點擊觸發與提示 title
        let dblClickAttr = isEditMode ? 'ondblclick="makeCellEditable(this)"' : '';
        let titleAttr = isEditMode ? 'title="💡 雙擊即可編輯日期"' : 'title="👀 瀏覽模式（唯讀）"';
        let cursorStyle = isEditMode ? 'cursor:pointer;' : 'cursor:default;';

        tbodyHtml += `<td class="${cellClass}" 
                          data-sheet="${sheetName}" 
                          data-task="${rowTitle}" 
                          data-rawdate="${dateShow === '(未排定)' ? '' : dateShow}"
                          ${dblClickAttr} 
                          style="${cursorStyle}" 
                          ${titleAttr}>${cellContent}</td>`;
      });

      computedSummaryMatrixPayload.rows.push({ title: rowTitle, values: rowValuesCache });
      tbodyHtml += `</tr>`;
    });
    
    tbodyHtml += "</tbody>";
    table.innerHTML += tbodyHtml;
  }

  function renderCachedMedicationLogs() {
    const container = document.getElementById("logsGridContainer");
    const statusText = document.getElementById("logsLoadingStatus");
    const sheetSelect = document.getElementById("sheetListSelect");
    const activeSheet = sheetSelect.value;

    container.innerHTML = "";
    if (!activeSheet) { statusText.innerText = "目前無可用操作分頁。"; return; }

    const targetSheetData = cachedLogsData.find(log => log.sheetName === activeSheet);
    if (!targetSheetData || !targetSheetData.waves) {
      statusText.innerText = "⚠️ 該分頁無防制紀錄資料。"; return;
    }

    // 🔐 唯讀控制
    const disabledAttr = !isEditMode ? 'disabled' : '';

    targetSheetData.waves.forEach((wave, wIdx) => {
      const mNum = wIdx + 1;
      let card = document.createElement("div"); card.className = "wave-card"; card.setAttribute("data-wave-num", mNum);
      
      let html = `<h4>${wave.waveName || '藥-' + mNum}</h4>`;
      
      html += `
        <div class="meta-bar">
          <span>📅 排程日期: <strong>${wave.date || "未排定"}</strong></span>
          <div class="water-edit-box">
            💧 水量: 
            <input type="text" class="water-input" value="${wave.totalWater || ''}" placeholder="如 100L" ${disabledAttr} oninput="recalculateCardDrugs(this)">
          </div>
        </div>
      `;
      
      (wave.diseases || []).forEach(diseaseObj => {
        html += `<div class="disease-container" data-disease-name="${diseaseObj.diseaseName}">`;
        html += `<div class="disease-title-row">🦠 ${diseaseObj.diseaseName}</div>`;
        
        (diseaseObj.drugs || []).forEach((drug, dIdx) => {
          html += `
            <div class="drug-matrix-row" data-drug-idx="${dIdx}">
              <span class="drug-index-label">藥 ${dIdx + 1}</span>
              <select class="chemical-select" ${disabledAttr} onchange="calculateDrugAmount(this)">
                <option value="" data-ratio="0">--未選藥劑--</option>
                ${globalChemicalOptions.map(opt => `<option value="${opt.name}" data-ratio="${opt.ratio}" ${drug.name === opt.name ? 'selected' : ''}>${opt.name}</option>`).join('')}
              </select>
              <input type="text" class="num-input target-input" value="${drug.target || ''}" ${disabledAttr} placeholder="預" oninput="this.value=this.value.replace(/[^0-9.]/g,'')">
              <input type="text" class="num-input actual-input" value="${drug.actual || ''}" ${disabledAttr} placeholder="實" oninput="this.value=this.value.replace(/[^0-9.]/g,'')">
            </div>
          `;
        });
        html += `</div>`;
      });
      card.innerHTML = html; container.appendChild(card);
    });
    statusText.innerText = `⚡ 目前顯示：「${activeSheet}」分頁紀錄 (本地快取極速載入)。`;
  }

  function calculateDrugAmount(selectElem) {
    if (!isEditMode) return;
    const selectedOption = selectElem.options[selectElem.selectedIndex];
    const ratio = parseFloat(selectedOption.getAttribute("data-ratio")) || 0;
    if (ratio === 0) return;

    const card = selectElem.closest('.wave-card');
    const waterInput = card.querySelector('.water-input');
    const waterVol = parseFloat(waterInput.value.replace(/[^0-9.]/g, '')) || 0;
    if (waterVol === 0) return;

    const result = +(waterVol * ratio).toFixed(2); 

    const row = selectElem.closest('.drug-matrix-row');
    row.querySelector('.target-input').value = result;
    row.querySelector('.actual-input').value = result;
  }

  function recalculateCardDrugs(waterInput) {
    if (!isEditMode) return;
    const waterVol = parseFloat(waterInput.value.replace(/[^0-9.]/g, '')) || 0;
    if (waterVol === 0) return;

    const card = waterInput.closest('.wave-card');
    const selects = card.querySelectorAll('.chemical-select');
    
    selects.forEach(sel => {
      const ratio = parseFloat(sel.options[sel.selectedIndex].getAttribute("data-ratio")) || 0;
      if (ratio > 0) {
        const result = +(waterVol * ratio).toFixed(2);
        const row = sel.closest('.drug-matrix-row');
        row.querySelector('.target-input').value = result;
        row.querySelector('.actual-input').value = result;
      }
    });
  }

  function saveMedicationLogsToBackend() {
    if (!isEditMode) return;
    const sheetSelect = document.getElementById("sheetListSelect");

    if (!activeSheet) { alert("請先選取要儲存的分頁！"); return; }

    const container = document.getElementById("logsGridContainer");
    const cards = container.querySelectorAll('.wave-card');
    let wavesPayload = [];

    cards.forEach(card => {
      let waveNum = card.getAttribute('data-wave-num');
      let totalWater = card.querySelector('.water-input').value.trim();
      let diseaseContainers = card.querySelectorAll('.disease-container');
      let diseasesData = [];

      diseaseContainers.forEach(dBox => {
        let diseaseName = dBox.getAttribute('data-disease-name');
        let drugRows = dBox.querySelectorAll('.drug-matrix-row');
        let drugsData = [];

        drugRows.forEach(dRow => {
          let sel = dRow.querySelector('.chemical-select');
          let name = sel.value;
          let target = dRow.querySelector('.target-input').value.trim();
          let actual = dRow.querySelector('.actual-input').value.trim();

          drugsData.push({ name, target, actual });
        });

        diseasesData.push({ diseaseName, drugs: drugsData });
      });

      wavesPayload.push({ waveNum, totalWater, diseases: diseasesData });
    });

    const btn = document.getElementById("saveLogsBtn");
    btn.disabled = true;
    setGlobalBlocker(true, "💾 正在儲存防制紀錄至雲端...");

    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        type: "saveMedicationLogs",
        fileId: currentFileId,
        sheetName: activeSheet,
        waves: wavesPayload
      })
    })
    .then(res => res.text())
    .then(result => {
      if (isGasSuccess(result)) {
        alert(`🎉 分頁「${activeSheet}」防制紀錄已順利更新寫回 Excel！`);
        fetchMedicationLogsFromBackend(false);
      } else {
        alert("⚠️ 儲存失敗：" + result);
      }
    })
    .catch(err => {
      console.error(err);
      alert("連線失敗，無法更新防制紀錄！");
    })
    .finally(() => {
      btn.disabled = !isEditMode;
      setGlobalBlocker(false);
    });
  }

  // 雙擊將儲存格轉為日期 input
  function makeCellEditable(td) {
    if (!isEditMode) return;
    if (td.querySelector('input')) return; 

    const currentVal = td.getAttribute('data-rawdate') || '';
    const sheetName = td.getAttribute('data-sheet');
    const taskName = td.getAttribute('data-task');

    td.innerHTML = `<input type="date" value="${currentVal}" style="width:110px; font-size:12px; padding:2px; text-align:center;">`;
    const input = td.querySelector('input');
    input.focus();

    input.onblur = function () {
      saveCellDateDirectly(td, sheetName, taskName, input.value, currentVal);
    };

    input.onkeydown = function (e) {
      if (e.key === 'Enter') {
        input.blur();
      } else if (e.key === 'Escape') {
        renderFixedSummaryMatrix();
      }
    };
  }

  // 將新日期傳送到後端，並更新本地端與行事曆
  function saveCellDateDirectly(td, sheetName, taskName, newDate, oldDate) {
    if (!isEditMode) return;
    if (newDate === oldDate) {
      renderFixedSummaryMatrix();
      return;
    }

    setGlobalBlocker(true, `⏳ 正在更新 [${sheetName}] ${taskName} 日期...`);

    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        type: "updateCellAndSummary",
        fileId: currentFileId,
        sheetName: sheetName,
        taskName: taskName,
        newDate: newDate
      })
    })
    .then(res => res.text())
    .then(result => {
      if (isGasSuccess(result)) {
        let rawItem = allRawEvents.find(e => e.extendedProps.sheetName === sheetName && e.title.includes(taskName));
        if (rawItem) {
          rawItem.start = newDate;
        } else if (newDate) {
          allRawEvents.push({
            title: taskName,
            start: newDate,
            extendedProps: { sheetName: sheetName, rawDateText: newDate }
          });
        }

        if (calendar) calendar.refetchEvents();
        renderFixedSummaryMatrix();
      } else {
        alert("⚠️ 日期更新失敗：" + result);
        renderFixedSummaryMatrix();
      }
    })
    .catch(err => {
      console.error(err);
      alert("連線失敗，無法更新日期！");
      renderFixedSummaryMatrix();
    })
    .finally(() => {
      setGlobalBlocker(false);
    });
  }

  // 系統初始化開頭直接打開模式選擇視窗
  window.onload = function() {
    openModeModal();
  };
</script>
