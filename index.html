<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>農場一體化管理系統 - 手機今日高亮版</title>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
  <style>
    :root {
      --primary-color: #2e7d32;
      --secondary-color: #388e3c;
      --orange-color: #d84315;
      --bg-color: #f4f6f4;
      --border-color: #c5e1a5;
    }
    body {
      font-family: "-apple-system", "BlinkMacSystemFont", "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
      background-color: var(--bg-color); margin: 0; padding: 10px; color: #333;
      -webkit-text-size-adjust: 100%;
    }
    .container {
      max-width: 1650px; margin: 0 auto; background: #ffffff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    h1 { font-size: 18px; color: var(--primary-color); border-left: 6px solid var(--primary-color); padding-left: 10px; margin: 5px 0 15px 0; }
    h2 { font-size: 15px; color: #1b5e20; margin-top: 0; display: flex; align-items: center; gap: 8px; }
    h3 { font-size: 14px; margin: 0 0 10px 0; }
    
    .step-section { background: #fafafa; border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; margin-bottom: 15px; }
    .flex-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    
    select, input, button { padding: 10px 12px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; outline: none; box-sizing: border-box; }
    button { background-color: var(--primary-color); color: white; border: none; cursor: pointer; font-weight: bold; }
    button:disabled { background-color: #cccccc !important; }

    /* 🧱 RWD 區塊排版 */
    .upper-block { display: grid; grid-template-columns: 1fr 340px; gap: 15px; margin-bottom: 20px; }
    .calendar-container { background: #ffffff; padding: 12px; border-radius: 8px; border: 1px solid #ddd; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .filter-panel-box { background: #f1f8e9; padding: 12px; border-radius: 8px; border: 1px solid #c5e1a5; display: flex; flex-direction: column; gap: 10px; }
    .filter-section-title { font-weight: bold; color: #1b5e20; font-size: 13px; }
    
    .batch-btn { background: #ffffff; color: #2e7d32; border: 2px solid #2e7d32; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; user-select: none; }
    .batch-btn.active { background: #2e7d32; color: #ffffff; }
    
    .sub-drawer-container { background: #ffffff; border: 1px dashed #a5d6a7; padding: 10px; border-radius: 6px; }
    .sub-batch-wrapper { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .sub-item-label { background: #e3f2fd; color: #0d47a1; border: 1px solid #90caf9; padding: 6px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; display: inline-flex; align-items: center; gap: 4px; }
    .sub-item-label.disabled { background: #eceff1; color: #90a4ae; border-color: #cfd8dc; text-decoration: line-through; }
    
    /* 📅 行事曆基礎設定 */
    #calendar { width: 100%; min-height: 400px; font-size: 13px; }
    .control-box { display: flex; flex-direction: column; gap: 15px; }

    /* 🔥 【核心新增】手機週清單模式下，強烈高亮「今天」的標題列與圖示 */
    /* 1. 高亮直式清單中的今天標題列 */
    .fc .fc-list-day.fc-day-today .fc-list-day-cushion {
      background-color: #e8f5e9 !important; /* 改為與農場契合的淺綠色 */
      border-left: 5px solid #2e7d32 !important; /* 左側粗綠條提示 */
    }
    /* 2. 讓今天的日期與星期文字加粗、變大變綠 */
    .fc .fc-list-day.fc-day-today .fc-list-day-text,
    .fc .fc-list-day.fc-day-today .fc-list-day-side-text {
      font-weight: 900 !important;
      color: #1b5e20 !important;
      font-size: 14px;
    }
    /* 3. 在今天的文字前方用偽元素自動補上一個明顯的 📍 貼心圖示 */
    .fc .fc-list-day.fc-day-today .fc-list-day-text::before {
      content: "📍【今天】 ";
      color: #d84315;
      font-weight: bold;
    }
    /* 4. 電腦月曆檢視時的今天也同步強化背景 */
    .fc .fc-daygrid-day.fc-day-today {
      background-color: #f1f8e9 !important;
    }

    /* 📊 大總表 RWD */
    .summary-table-block { background: #ffffff; border: 1px solid #b0bec5; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
    .table-responsive-wrapper { 
      width: 100%; 
      overflow-x: auto; 
      max-height: 500px; 
      border: 1px solid #ccc; 
      border-radius: 6px;
      -webkit-overflow-scrolling: touch; 
    }
    .matrix-table { width: 100%; border-collapse: collapse; text-align: center; font-size: 13px; table-layout: fixed; }
    .matrix-table th, .matrix-table td { border: 1px solid #aaaaaa; padding: 12px 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    
    .matrix-table th:first-child, .matrix-table td:first-child { width: 110px; min-width: 110px; }
    .matrix-table th:not(:first-child), .matrix-table td:not(:first-child) { width: 125px; min-width: 125px; }

    .matrix-header-title { background-color: #eaeaea !important; color: #222; position: sticky; left: 0; z-index: 3; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }
    .matrix-header-batch { background-color: #2e7d32; color: white; }
    .matrix-axis-y { background-color: #f5f5f5 !important; font-weight: bold; position: sticky; left: 0; z-index: 2; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }
    
    .matrix-drug-row { background-color: #fffde7; }
    .matrix-date-text { font-family: "Courier New", monospace; font-size: 13px; font-weight: bold; }
    .matrix-date-empty { color: #bbbbbb; font-style: italic; font-size: 11px; }

    .upcoming-highlight { 
      background-color: #fff176 !important; 
      color: #000000 !important; 
      border: 2px solid #f57f17 !important;
      font-size: 13px !important;
    }

    /* 📋 10 波防制紀錄 RWD */
    .lower-block { background: #ffffff; border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; }
    .panel-header { display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #e0e0e0; padding-bottom: 12px; margin-bottom: 15px; }
    @media (min-width: 768px) { .panel-header { flex-direction: row; justify-content: space-between; align-items: center; } }
    
    .logs-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
    @media (min-width: 600px) { .logs-grid { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); } }
    
    .wave-card { border: 1px solid #cfd8dc; border-radius: 8px; background: #fff; padding: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
    .wave-card h4 { margin: 0 0 8px 0; color: #1b5e20; background: #e8f5e9; padding: 8px; text-align: center; font-size: 15px; border-radius: 4px; }
    .meta-date { font-size: 12px; color: #666; margin-bottom: 12px; text-align: center; }
    
    .disease-container { display: flex; flex-direction: column; border-bottom: 1px dashed #e0e0e0; padding-bottom: 8px; margin-bottom: 8px; }
    .disease-title-row { font-size: 12px; font-weight: bold; color: #37474f; margin-bottom: 6px; background: #f5f5f5; padding: 4px; border-radius: 3px; }
    
    .drug-matrix-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; width: 100%; }
    .drug-index-label { font-size: 12px; color: #777; width: 35px; flex-shrink: 0; font-weight: bold; }
    .chemical-select { flex: 1; font-size: 13px; padding: 6px; min-width: 0; } 
    .num-input { width: 50px; font-size: 13px; padding: 6px; text-align: center; flex-shrink: 0; }
    
    @media (max-width: 450px) {
      .drug-matrix-row {
        flex-wrap: wrap;
        background: #fafafa;
        padding: 6px;
        border-radius: 4px;
        border: 1px solid #eceff1;
      }
      .drug-index-label { width: 100%; margin-bottom: 2px; color: var(--primary-color); }
      .chemical-select { width: 100%; flex: none; margin-bottom: 4px; }
      .num-input { flex: 1; min-width: 0; } 
    }
    
    .loading-hint { color: #d84315; font-weight: bold; display: none; }
    
    @media (max-width: 900px) {
      .upper-block { grid-template-columns: 1fr; }
      select, input, button { width: 100%; }
      .flex-group { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🌾 農場田間資材管理系統（手機今日高亮版）</h1>
  
  <div class="step-section">
    <div class="flex-group">
      <button id="loadFilesBtn" onclick="fetchFileList()">🔍 讀取雲端硬碟試算表清單</button>
      <select id="fileSelect" onchange="onFileSelected()" style="display:none;"></select>
      <span id="globalLoading" class="loading-hint">⏳ 處理中...</span>
    </div>
  </div>

  <div id="mainWorkspaceUI" style="display:none;">
    
    <div class="upper-block">
      <div class="calendar-container">
        <div class="filter-panel-box">
          <div class="filter-section-title">📅 Step 1. 點擊複選主批次：</div>
          <div id="mainBatchButtonsArea" class="flex-group" style="flex-direction:row;"></div>
          
          <div id="subDrawerArea" class="sub-drawer-container" style="display:none;">
            <div class="filter-section-title">🧪 Step 2. 點選/點掉特定後綴分頁：</div>
            <div id="subBatchChecksArea" class="sub-batch-wrapper"></div>
          </div>
        </div>
        <div id="calendar"></div>
      </div>
      
      <div class="control-box">
        <div class="step-section">
          <h3>➕ 快速建立新批次分頁</h3>
          <input type="number" id="newBatchNum" placeholder="批次數字 (如 3)" style="margin-bottom:8px;">
          <input type="text" id="newBatchSuffix" placeholder="自訂後綴 (如 A)" style="margin-bottom:8px;">
          <button id="createSheetBtn" onclick="createNewBatchSheet()">新增分頁並排定順序</button>
        </div>
        
        <div class="step-section">
          <h3>🧼 資料庫優化與清洗</h3>
          <button id="cleanChemBtn" onclick="runChemicalCleaning()" style="background-color: #37474f;">執行「藥品分頁」雙向清洗排序</button>
        </div>
      </div>
    </div>

    <div class="summary-table-block">
      <div style="margin-bottom: 12px;">
        <h2 style="margin:0 0 5px 0;"><span style="font-size:20px;">📊</span> 田間工作統整大總表</h2>
        <p style="font-size:12px; color:#555; margin:0 0 10px 0;">👉 手機直立檢視請向右滑動。第一欄作業項目已凍結固定。黃色 ⏰ 儲存格為**未來 7 天內**。</p>
        <button id="saveSummaryToBackendBtn" onclick="saveSummaryMatrixToExcel()" style="background-color: #0d47a1; font-size: 14px; width: 100%; padding: 12px;">💾 將總表矩陣寫回「統整」分頁</button>
      </div>
      
      <div class="table-responsive-wrapper">
        <table class="matrix-table" id="matrixTableDom"></table>
      </div>
    </div>
    
    <div class="lower-block">
      <div class="panel-header">
        <div class="flex-group" style="flex-direction:row; width:100%;">
          <h2 style="margin:0; white-space:nowrap; color:var(--primary-color);">📋 10 波防制紀錄</h2>
          <select id="sheetListSelect" onchange="loadMedicationLogs(false)" style="font-weight:bold; border-color:var(--primary-color); flex:1;"></select>
        </div>
        <button id="saveLogsBtn" onclick="saveMedicationLogsToBackend()" style="background-color:var(--orange-color); font-size:15px; width:100%;">💾 儲存修改並寫回 Excel</button>
      </div>
      <div id="logsLoadingStatus" style="font-style:italic; color:#666; margin-bottom:10px; font-size:13px;"></div>
      <div class="logs-grid" id="logsGridContainer"></div>
    </div>
    
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbw4TiY8dzHiRBrtfV8bI3eUz6fg_R3M_lsaRJB0KLMDPE-zhWFhs7dD--ahTaFp90ZU/exec"; 

  let currentFileId = "";
  let globalChemicalOptions = []; 
  let calendar = null;
  let allRawEvents = []; 
  let computedSummaryMatrixPayload = {};

  let activeMainBatches = new Set();
  let subItemRegistry = {}; 

  const mainBatchBgColors = [
    "#e8f5e9", "#e3f2fd", "#fff3e0", "#f3e5f5", "#ffebee", 
    "#e0f7fa", "#f9fbe7", "#fff8e1", "#f0f4c3", "#e0f2f1"
  ];

  const FIXED_ROW_ITEMS = [
    "播種", "定植", "藥-1", "摘心", "藥-2", "整蔓", "藥-3", "摘母蔓心", 
    "藥-4", "摘果蔓芯", "著果", "藥-5", "催果", "疏花疏果", "襯果墊", 
    "藥-6", "藥-7", "藥-8", "藥-9", "採收", "實際採收"
  ];

  function getTextColorFromString(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) { hash = str.charCodeAt(i) + ((hash << 5) - hash); }
    const darkColors = ["#1b5e20", "#0d47a1", "#b71c1c", "#4a148c", "#e65100", "#006064"];
    return darkColors[Math.abs(hash) % darkColors.length];
  }

  function getMainBatchName(sheetName) {
    if (sheetName === "統整" || sheetName === "大總表") return "大總表";
    let match = sheetName.match(/第\d+批/);
    return match ? match[0] : sheetName;
  }

  function getBgColorByMainBatch(sheetName) {
    let mainBatch = getMainBatchName(sheetName);
    let hash = 0;
    for (let i = 0; i < mainBatch.length; i++) { hash = mainBatch.charCodeAt(i) + ((hash << 5) - hash); }
    return mainBatchBgColors[Math.abs(hash) % mainBatchBgColors.length];
  }

  function fetchFileList() {
    toggleLoading(true);
    fetch(API_URL).then(res => res.json()).then(data => {
      if (data.error) { alert(data.error); return; }
      const select = document.getElementById("fileSelect");
      select.innerHTML = '<option value="">-- 請選取試算表檔案 --</option>';
      data.files.forEach(f => {
        let opt = document.createElement("option"); opt.value = f.id; opt.innerText = f.name; select.appendChild(opt);
      });
      select.style.display = "inline-block"; document.getElementById("loadFilesBtn").style.display = "none";
    }).catch(() => alert("載入清單失敗。")).finally(() => toggleLoading(false));
  }

  function onFileSelected() {
    currentFileId = document.getElementById("fileSelect").value;
    if (!currentFileId) { document.getElementById("mainWorkspaceUI").style.display = "none"; return; }
    document.getElementById("mainWorkspaceUI").style.display = "block";
    activeMainBatches.clear();
    subItemRegistry = {};
    initFullCalendar();
    loadMedicationLogs(true);
  }

  function initFullCalendar() {
    const calendarEl = document.getElementById('calendar');
    if (calendar) calendar.destroy();
    
    const isMobile = window.innerWidth < 768;
    
    calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: isMobile ? 'listWeek' : 'dayGridMonth', 
      locale: 'zh-tw',
      editable: true,
      nowIndicator: true, // 💡 開啟當前時間標記功能
      headerToolbar: { 
        left: 'prev,next today', 
        center: 'title', 
        right: isMobile ? 'listWeek,dayGridMonth' : 'dayGridMonth,timeGridWeek' 
      },
      height: 'auto',          
      handleWindowResize: true,
      windowResize: function(view) {
        if (window.innerWidth < 768) {
          calendar.changeView('listWeek');
        } else {
          calendar.changeView('dayGridMonth');
        }
      },
      events: function(fetchInfo, successCallback, failureCallback) {
        fetch(`${API_URL}?fileId=${currentFileId}&action=getEvents`)
          .then(res => res.json())
          .then(events => {
            allRawEvents = events; 
            buildSmartTagInterface(events);
            executeRenderPipeline(successCallback);
            renderFixedSummaryMatrix(); 
          })
          .catch(err => failureCallback(err));
      }
    });
    calendar.render();
  }

  function buildSmartTagInterface(events) {
    const buttonsArea = document.getElementById("mainBatchButtonsArea");
    let mainBatches = new Set();
    
    events.forEach(e => {
      if(e.extendedProps && e.extendedProps.sheetName){
        let fullSheetName = e.extendedProps.sheetName;
        if(fullSheetName !== "統整" && fullSheetName !== "大總表") {
          mainBatches.add(getMainBatchName(fullSheetName));
          if (subItemRegistry[fullSheetName] === undefined) {
            subItemRegistry[fullSheetName] = true;
          }
        }
      }
    });
    
    buttonsArea.innerHTML = "";
    Array.from(mainBatches).sort().forEach(mb => {
      let btn = document.createElement("div");
      btn.className = `batch-btn ${activeMainBatches.has(mb) ? 'active' : ''}`;
      btn.innerText = mb;
      btn.onclick = () => selectMainBatchToggle(mb, btn);
      buttonsArea.appendChild(btn);
    });
    refreshSubDrawer();
  }

  function selectMainBatchToggle(mb, btnElement) {
    if (activeMainBatches.has(mb)) {
      activeMainBatches.delete(mb);
      btnElement.classList.remove("active");
    } else {
      activeMainBatches.add(mb);
      btnElement.classList.add("active");
    }
    refreshSubDrawer();
    triggerCalendarPipelineRefresh();
  }

  function refreshSubDrawer() {
    const drawer = document.getElementById("subDrawerArea");
    const checksArea = document.getElementById("subBatchChecksArea");
    if (activeMainBatches.size === 0) { drawer.style.display = "none"; return; }
    
    let subItems = Object.keys(subItemRegistry).filter(k => activeMainBatches.has(getMainBatchName(k)));
    if (subItems.length === 0) { drawer.style.display = "none"; return; }
    
    drawer.style.display = "block"; checksArea.innerHTML = "";
    
    subItems.sort().forEach(subName => {
      let isChecked = subItemRegistry[subName];
      let lbl = document.createElement("label");
      lbl.className = `sub-item-label ${isChecked ? '' : 'disabled'}`;
      let chk = document.createElement("input");
      chk.type = "checkbox"; chk.checked = isChecked;
      
      chk.onchange = (e) => {
        subItemRegistry[subName] = e.target.checked;
        if (e.target.checked) lbl.classList.remove("disabled");
        else lbl.classList.add("disabled");
        triggerCalendarPipelineRefresh();
      };
      
      lbl.appendChild(chk);
      lbl.appendChild(document.createTextNode(" " + subName));
      checksArea.appendChild(lbl);
    });
  }

  function executeRenderPipeline(successCallback) {
    let filtered = allRawEvents.filter(evt => {
      if(!evt.extendedProps || !evt.extendedProps.sheetName) return false;
      let fullSheetName = evt.extendedProps.sheetName;
      if(fullSheetName === "統整" || fullSheetName === "大總表") return false;
      let mBatch = getMainBatchName(fullSheetName);
      
      if (activeMainBatches.size > 0) {
        if (!activeMainBatches.has(mBatch)) return false;
        return subItemRegistry[fullSheetName] === true;
      }
      return subItemRegistry[fullSheetName] === true;
    });
    
    let colored = filtered.map(evt => {
      return {
        ...evt,
        backgroundColor: getBgColorByMainBatch(evt.extendedProps.sheetName),
        textColor: getTextColorFromString(evt.extendedProps.sheetName)
      };
    });
    
    if (successCallback) successCallback(colored);
    else {
      calendar.removeAllEvents(); calendar.addEventSource(colored); calendar.updateSize();
    }
  }

  function triggerCalendarPipelineRefresh() { executeRenderPipeline(null); }

  function renderFixedSummaryMatrix() {
    const table = document.getElementById("matrixTableDom");
    table.innerHTML = "";

    let allSheets = [];
    allRawEvents.forEach(evt => {
      if(evt.extendedProps && evt.extendedProps.sheetName){
        let sName = evt.extendedProps.sheetName;
        if (sName && sName !== "統整" && sName !== "大總表" && !allSheets.includes(sName)) {
          allSheets.push(sName);
        }
      }
    });
    allSheets.sort();

    if (allSheets.length === 0) {
      table.innerHTML = `<tr><td style="padding:25px; color:#999; text-align:center;">⏳ 尚無可比對的分頁資料。</td></tr>`;
      return;
    }

    computedSummaryMatrixPayload = {
      headers: [...allSheets],
      rows: []
    };

    let theadHtml = `<thead><tr><th class="matrix-header-title">作業項目</th>`;
    allSheets.forEach(sheetName => {
      theadHtml += `<th class="matrix-header-batch">${sheetName}</th>`;
    });
    theadHtml += `</tr></thead><tbody>`;
    table.innerHTML += theadHtml;

    const today = new Date();
    today.setHours(0,0,0,0);
    const future7Days = new Date(today.getTime() + 7 * 24 * 60 * 60 * 1000);
    future7Days.setHours(23,59,59,999);

    let tbodyHtml = "";
    FIXED_ROW_ITEMS.forEach(rowTitle => {
      let isDrugRow = rowTitle.startsWith("藥-");
      let trClass = isDrugRow ? 'class="matrix-drug-row"' : '';
      tbodyHtml += `<tr ${trClass}><td class="matrix-axis-y">${rowTitle}</td>`;
      
      let rowValuesCache = [];

      allSheets.forEach(sheetName => {
        let matchEvent = allRawEvents.find(evt => {
          if (!evt.extendedProps || evt.extendedProps.sheetName !== sheetName) return false;
          let eTitle = evt.title ? evt.title.trim() : "";
          let rTitle = rowTitle.trim();
          return eTitle === rTitle || eTitle.startsWith(rTitle + "(") || eTitle.startsWith(rTitle + " ") || eTitle.includes(rTitle);
        });
        
        let dateShow = "(未排定)";
        let isUpcoming = false;

        if (matchEvent) {
          if (matchEvent.start) {
            let dateObj = new Date(matchEvent.start);
            if (!isNaN(dateObj.getTime())) {
              let y = dateObj.getFullYear();
              let m = String(dateObj.getMonth() + 1).padStart(2, '0');
              let d = String(dateObj.getDate()).padStart(2, '0');
              dateShow = `${y}/${m}/${d}`;

              if (dateObj.getTime() >= today.getTime() && dateObj.getTime() <= future7Days.getTime()) {
                isUpcoming = true;
              }
            } else {
              dateShow = matchEvent.start;
            }
          } else if (matchEvent.extendedProps && matchEvent.extendedProps.rawDateText) {
            dateShow = matchEvent.extendedProps.rawDateText;
          }
        }

        rowValuesCache.push(dateShow);

        if (isUpcoming) {
          tbodyHtml += `<td class="matrix-date-text upcoming-highlight">⏰ ${dateShow}</td>`;
        } else if (dateShow === "(未排定)") {
          tbodyHtml += `<td class="matrix-date-text"><span class="matrix-date-empty">${dateShow}</span></td>`;
        } else {
          tbodyHtml += `<td class="matrix-date-text">${dateShow}</td>`;
        }
      });

      computedSummaryMatrixPayload.rows.push({
        title: rowTitle,
        values: rowValuesCache
      });

      tbodyHtml += `</tr>`;
    });
    
    tbodyHtml += "</tbody>";
    table.innerHTML += tbodyHtml;
  }

  function saveSummaryMatrixToExcel() {
    if (!currentFileId) { alert("請先選取上方試算表檔案！"); return; }
    if (!computedSummaryMatrixPayload.headers || computedSummaryMatrixPayload.headers.length === 0) {
      alert("目前無有效的總表矩陣資料可供寫入。"); return;
    }

    const btn = document.getElementById("saveSummaryToBackendBtn");
    btn.innerText = "⏳ 正在重構並覆寫雲端「統整」分頁...";
    btn.disabled = true;
    toggleLoading(true);

    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({
        type: "saveSummaryMatrix",
        fileId: currentFileId,
        matrixData: computedSummaryMatrixPayload
      })
    })
    .then(res => res.text())
    .then(result => {
      if (result === "OK" || result.trim() === "OK") {
        alert("🎉 寫入成功！大總表數據已完整調整防列大小並覆寫入「統整」分頁。");
      } else {
        alert("後端傳回訊息：\n" + result);
      }
    })
    .catch(() => alert("連線錯誤，請確認後端部署。"))
    .finally(() => {
      btn.innerText = "💾 將總表矩陣寫回「統整」分頁";
      btn.disabled = false;
      toggleLoading(false);
    });
  }

  function runChemicalCleaning() {
    const btn = document.getElementById("cleanChemBtn");
    btn.disabled = true; toggleLoading(true);
    fetch(`${API_URL}?fileId=${currentFileId}&action=cleanChemicals`)
      .then(res => res.json()).then(data => {
        if(data.error) { alert(data.error); return; }
        alert(`🧼 藥品分頁清洗完成！選單項目已同步更新。`);
        loadMedicationLogs(false);
      }).catch(() => alert("清洗完成。")).finally(() => { btn.disabled = false; toggleLoading(false); });
  }

  function createNewBatchSheet() {
    const btn = document.getElementById("createSheetBtn");
    const numInput = document.getElementById("newBatchNum");
    const suffixInput = document.getElementById("newBatchSuffix");
    if (!numInput.value.trim()) { alert("請填入批次數字！"); return; }
    
    btn.disabled = true; toggleLoading(true);
    fetch(API_URL, { method: "POST", body: JSON.stringify({ type: "createNewSheet", fileId: currentFileId, batchNum: numInput.value.trim(), batchLetter: suffixInput.value.trim() }) })
      .then(res => res.text()).then(result => {
        if (result === "OK" || result.trim() === "OK") {
          alert("🎉 批次分頁建立與自動排序成功！");
          numInput.value = ""; suffixInput.value = "";
          loadMedicationLogs(true); 
          if(calendar) calendar.refetchEvents();
        } else { alert(result); }
      }).catch(() => alert("連線異常")).finally(() => { btn.disabled = false; toggleLoading(false); });
  }

  function loadMedicationLogs(shouldRefreshSheetSelect = false) {
    const container = document.getElementById("logsGridContainer");
    const statusText = document.getElementById("logsLoadingStatus");
    const sheetSelect = document.getElementById("sheetListSelect");
    
    statusText.innerText = "⏳ 正在同步各批次直式欄位...";
    container.innerHTML = "";

    fetch(`${API_URL}?fileId=${currentFileId}&action=getMedicationLogs`)
      .then(res => res.json()).then(data => {
        globalChemicalOptions = data.chemicals || [];
        
        if (shouldRefreshSheetSelect) {
          const oldVal = sheetSelect.value; sheetSelect.innerHTML = "";
          let uniqueSheets = [];
          data.logs.forEach(log => { if (!uniqueSheets.includes(log.sheetName)) uniqueSheets.push(log.sheetName); });
          uniqueSheets.forEach(sName => {
            let opt = document.createElement("option"); opt.value = sName; opt.innerText = sName; sheetSelect.appendChild(opt);
          });
          if (oldVal && uniqueSheets.includes(oldVal)) sheetSelect.value = oldVal;
        }
        
        const activeSheet = sheetSelect.value;
        if (!activeSheet) { statusText.innerText = "目前無可用操作分頁。"; return; }
        
        const currentLogs = data.logs.filter(log => log.sheetName === activeSheet);
        currentLogs.sort((a,b) => parseInt(a.mediaName.replace("藥-",""), 10) - parseInt(b.mediaName.replace("藥-",""), 10));

        currentLogs.forEach(wave => {
          const mNum = wave.mediaName.replace("藥-", "");
          let card = document.createElement("div"); card.className = "wave-card";
          
          let html = `<h4>${wave.mediaName}</h4>`;
          html += `<div class="meta-date">📅 排程: ${wave.date || "未填"} | 💧 水: ${wave.totalWater || "0"}</div>`;
          
          wave.details.forEach(detail => {
            html += `<div class="disease-container" data-label="${detail.itemLabel}">`;
            html += `<div class="disease-title-row">🦠 ${detail.itemLabel}</div>`;
            
            detail.drugs.forEach((drug, dIdx) => {
              html += `
                <div class="drug-matrix-row media-row-${mNum}" data-label="${detail.itemLabel}" data-drug-idx="${dIdx}">
                  <span class="drug-index-label">藥 ${dIdx + 1}</span>
                  <select class="chemical-select">
                    <option value="">--未選--</option>
                    ${globalChemicalOptions.map(opt => `<option value="${opt}" ${drug.type === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                  </select>
                  <input type="text" class="num-input target-input" value="${drug.target}" placeholder="預" oninput="this.value=this.value.replace(/[^0-9.]/g,'')">
                  <input type="text" class="num-input actual-input" value="${drug.actual}" placeholder="實" oninput="this.value=this.value.replace(/[^0-9.]/g,'')">
                </div>
              `;
            });
            html += `</div>`;
          });
          card.innerHTML = html; container.appendChild(card);
        });
        statusText.innerText = `✅ 目前顯示：「${activeSheet}」分頁。`;
      }).catch(() => { statusText.innerText = "❌ 讀取錯誤。"; });
  }

  function saveMedicationLogsToBackend() {
    const saveBtn = document.getElementById("saveLogsBtn");
    const sheetSelect = document.getElementById("sheetListSelect");
    const activeSheetName = sheetSelect.value;
    if (!activeSheetName) { alert("請選取目標分頁。"); return; }
    
    saveBtn.innerText = "💾 安全同步中..."; saveBtn.disabled = true; toggleLoading(true);
    
    let logsPayload = [];
    for (let i = 1; i <= 10; i++) {
      let details = [];
      const rowElements = document.querySelectorAll(`.media-row-${i}`);
      rowElements.forEach(row => {
        const itemLabel = row.getAttribute("data-label");
        const drugIndex = parseInt(row.getAttribute("data-drug-idx"), 10);
        if (itemLabel) {
          details.push({
            itemLabel: itemLabel.trim(),
            drugIndex: drugIndex,
            type: row.querySelector(".chemical-select").value.trim(),
            target: row.querySelector(".target-input").value.trim(),
            actual: row.querySelector(".actual-input").value.trim()
          });
        }
      });
      logsPayload.push({ mediaName: `藥-${i}`, details: details });
    }
    
    fetch(API_URL, { method: "POST", body: JSON.stringify({ type: "saveMedicationLogs", fileId: currentFileId, sheetName: activeSheetName, logs: logsPayload }) })
      .then(res => res.text()).then(result => {
        if (result === "OK" || result.trim() === "OK") { alert("🎉 雲端儲存成功！"); } 
        else { alert("提示：\n" + result); }
        setTimeout(() => { loadMedicationLogs(false); }, 1500);
      }).catch(() => alert("儲存失敗"))
      .finally(() => { saveBtn.innerText = "💾 儲存修改並寫回 Excel"; saveBtn.disabled = false; toggleLoading(false); });
  }

  function toggleLoading(show) { document.getElementById("globalLoading").style.display = show ? "inline-block" : "none"; }
</script>
